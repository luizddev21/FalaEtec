<!-- Documento inicial servido pelo Vite; define idioma, metadados e recursos carregados antes da aplicação React. -->
<!doctype html>
<html lang="pt-BR">
  <head>
   <meta charset="UTF-8" />
   <title>FalaEtec — Canal de Comunicação Escolar</title>

   <meta name="description" content="FalaEtec é uma plataforma de comunicação escolar para alunos, professores e gestores. Envie avaliações, sugestões, solicitações e relatos em um ambiente seguro." />

   <meta name="robots" content="index, follow" />

   <meta name="author" content="Equipe FalaEtec" />

   <meta name="theme-color" content="#ffffff" />

   <link rel="icon" type="image/png" sizes="192x192" href="/favicon-falaetec.png" />

   <link rel="apple-touch-icon" href="/favicon-falaetec.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="FalaEtec" />
    <meta property="og:title" content="FalaEtec — Canal de Comunicação Escolar" />
    <meta property="og:description" content="Conectando alunos, professores e gestores em um ambiente de comunicação escolar." />
    <meta property="og:url" content="https://falaetec.tech/" />
    <meta property="og:image" content="https://falaetec.tech/images/falaetec_logo.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FalaEtec — Canal de Comunicação Escolar" />
    <meta name="twitter:description" content="Sua plataforma de comunicação escolar." />
    <meta name="twitter:image" content="https://falaetec.tech/images/falaetec_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FalaEtec</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Ponto de montagem: config/main.jsx inicializa o React dentro deste elemento. -->
    <div id="root"></div>

    <!-- Widget externo de tradução para Libras, disponibilizado pelo VLibras. -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>

    <!-- Ionicons fornece os elementos de ícone usados pelos componentes da interface. -->
    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>
    <!-- Carrega a configuração que cria a raiz React e renderiza App.jsx. -->
    <script type="module" src="/src/config/main.jsx"></script>

    <!-- Inicializa o widget VLibras carregado pelo script externo acima. -->
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget("https://vlibras.gov.br/app");
    </script>
  </body>
</html>
